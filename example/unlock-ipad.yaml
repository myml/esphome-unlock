# 一块 ESP32 板 = 一个 BLE 身份，解锁一台 iPad。
#
# 关键平台规则（本组件会在编译期替你检查）：
#   * iOS 必须 passkey_mode: secure_connections —— legacy 配对在 iOS 上不工作
#   * 想换成 Android 平板请用 example/unlock-android.yaml
#
# 【不要】在这块板子上加 esp32_ble_tracker / bluetooth_proxy：
#   esp32_ble 的 setup_priority 是 BLUETOOTH，会先抢走唯一的 BLE 控制器，
#   键盘组件的 init 随后全部静默失败（编译过、启动过、日志无异常），
#   结果两个功能一起废掉。

substitutions:
  device_name: unlock-ipad

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      # Bluedroid（不是 NimBLE）—— 上游组件按 Bluedroid GATTS 实现
      CONFIG_BT_ENABLED: y
      CONFIG_BT_CONTROLLER_ENABLED: y
      CONFIG_BT_BLUEDROID_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: n
      CONFIG_BT_BLE_ENABLED: y
      CONFIG_BT_GATTS_ENABLE: y
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_42_ADV_EN: y
      CONFIG_BT_BLE_42_SCAN_EN: y
      CONFIG_BT_BLE_SMP_ENABLE: y
      CONFIG_BT_ACL_CONNECTIONS: "4"

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Unlock Fallback Hotspot"
    password: !secret ap_password

captive_portal:

external_components:
  # 上游：真正的 BLE HID 键盘实现（本组件完全依赖它）
  - source:
      type: git
      url: https://github.com/markusg1234/ESPHome-espidf_ble_keyboard
      ref: main
      path: components
    refresh: 0s
    components: [ espidf_ble_keyboard ]

  # 本仓库：只做 action 拼接和平台规则校验
  - source:
      type: git
      url: https://github.com/myml/esphome-unlock
      ref: main
    refresh: 0s
    components: [ unlock_keyboard ]

espidf_ble_keyboard:
  id: kb
  # 平板的蓝牙列表里显示这个名字
  device_name: "unlock_ipad"
  # iPad 走 secure_connections + 6 位 PIN
  passkey: !secret ipad_pairing_pin
  passkey_mode: secure_connections
  host_slots: 1

button:
  # 只唤醒，不输密码 —— 调试和「屏幕已经亮着但锁着」的场景用得上。
  # 不写 password 时，本组件不会因为上游的 passkey 设置报任何错。
  - platform: unlock_keyboard
    keyboard_id: kb
    name: "Wake iPad"
    os: ios

  # 唤醒 -> 等屏幕亮 -> 输 PIN。iOS 的密码框位数够了会自动提交，
  # 所以 press_enter 不填时 os: ios 默认不发回车。
  - platform: unlock_keyboard
    keyboard_id: kb
    name: "Unlock iPad"
    os: ios
    password: !secret ipad_lock_pin
    # 屏幕从全黑到能接受输入需要时间，慢的机器可以往上加
    wake_delay: 2000
